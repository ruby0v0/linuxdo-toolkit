[project]
name = "linuxdo-toolkit"
version = "0.1.0"
description = "轻量级 linux.do 每日访问保持工具：自动登录 + 克制的真实感浏览（仅供个人学习使用）"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "pydantic-settings>=2.5",
    "loguru>=0.7",
    "curl-cffi>=0.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
