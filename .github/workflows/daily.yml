name: Daily Visit

on:
  schedule:
    # 多时段触发策略（避开整点/固定时刻，降低被风控特征命中的概率）。
    # 核心思路：GitHub runner 每次分配到不同出口 IP，一天多次 → 只要任一次
    # 撞上未被严格限流的 IP 即算当天成功（维持访问天数只需一天成功一次）。
    # GitHub cron 为 UTC；下列 6 个时段对应北京时间：
    #   08:17 / 11:23 / 14:29 / 17:31 / 20:43 / 23:53
    - cron: "17 0 * * *"   # 北京 08:17
    - cron: "23 3 * * *"   # 北京 11:23
    - cron: "29 6 * * *"   # 北京 14:29
    - cron: "31 9 * * *"   # 北京 17:31
    - cron: "43 12 * * *"  # 北京 20:43
    - cron: "53 15 * * *"  # 北京 23:53
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

concurrency:
  group: daily-visit
  cancel-in-progress: false

jobs:
  daily-visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 真 Chrome（DrissionPage 接管），比 Playwright 自带 Chromium 指纹更真
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # DrissionPage 接管真实 Chrome，需要系统库 + 虚拟显示器兜底（CI 无物理屏幕）。
      # ubuntu-latest 现为 24.04，使用 libasound2t64；下方已覆盖常见 Chrome 运行时依赖。
      - name: Install system deps (xvfb, fonts, chrome runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libasound2t64 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 libatspi2.0-0 \
            fonts-wqy-zenhei fonts-noto-cjk

      # push / 手动触发时跑质量检查；schedule 跳过以加速
      - name: Lint & Test
        if: github.event_name != 'schedule'
        run: |
          uv run ruff check .
          uv run python -m pytest -q

      # 出口 IP 诊断（只打印，便于观察 Runner 的 IP 归属，不影响流程）
      - name: Show egress IP (diagnostic)
        run: |
          echo "=== egress IP / trace ==="
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace || true
        continue-on-error: true

      - name: Run daily visit
        env:
          LINUXDO_COOKIES: ${{ secrets.LINUXDO_COOKIES }}
          LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
          LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
          BROWSE_ENABLED: ${{ vars.BROWSE_ENABLED || 'true' }}
          BROWSE_COUNT: ${{ vars.BROWSE_COUNT || '6' }}
          LIKE_ENABLED: ${{ vars.LIKE_ENABLED || 'false' }}
          HEADLESS: "true"
          # setup-chrome 输出的 chrome 可执行文件路径
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          NOTIFY_ENABLED: ${{ vars.NOTIFY_ENABLED || 'false' }}
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'telegram' }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
          # 可选：住宅代理（治本），配置后优先使用
          PLAYWRIGHT_PROXY: ${{ secrets.PLAYWRIGHT_PROXY }}
        # xvfb-run 提供虚拟显示器兜底：即使 headless 某些 Linux 环境下异常也能启动
        run: xvfb-run -a uv run python -m src.main
