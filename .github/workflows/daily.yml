name: Daily Visit

on:
  schedule:
    # 低频、随机错开的触发点（避开整点/固定时刻，降低被风控特征命中的概率）。
    # GitHub cron 是 UTC 时间；下面为每天 3 个分散时段：
    #   UTC 01:17 = 北京 09:17
    #   UTC 07:33 = 北京 15:33
    #   UTC 13:41 = 北京 21:41
    # 一天多次 → 每次 runner 出口 IP 不同，只要任一次未撞上严格限流即成功。
    - cron: "17 1 * * *"
    - cron: "33 7 * * *"
    - cron: "41 13 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: read

concurrency:
  group: daily-visit
  cancel-in-progress: false

jobs:
  daily-visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 真 Chrome（DrissionPage 接管），比 Playwright 自带 Chromium 指纹更真
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # push / 手动触发时跑质量检查；schedule 跳过以加速
      - name: Lint & Test
        if: github.event_name != 'schedule'
        run: |
          uv run ruff check .
          uv run python -m pytest -q

      # 免费换出口 IP：Cloudflare WARP 走 Cloudflare 自己的出口（warp=on）。
      # 注意：WARP 出口也是共享 IP，效果需实测；若稳定可用可保留，否则置为忽略。
      - name: Setup Cloudflare WARP (free egress IP change)
        uses: caomingjun/warp@v0.3.1
        with:
          mode: "warp"
        continue-on-error: true

      # 卡到中国时区并允许 WARP 生效
      - name: Show egress IP (diagnostic)
        run: |
          curl -s --max-time 15 https://www.cloudflare.com/cdn-cgi/trace || true
        continue-on-error: true

      - name: Run daily visit
        env:
          LINUXDO_COOKIES: ${{ secrets.LINUXDO_COOKIES }}
          LINUXDO_USERNAME: ${{ secrets.LINUXDO_USERNAME }}
          LINUXDO_PASSWORD: ${{ secrets.LINUXDO_PASSWORD }}
          BROWSE_ENABLED: ${{ vars.BROWSE_ENABLED || 'true' }}
          BROWSE_COUNT: ${{ vars.BROWSE_COUNT || '6' }}
          LIKE_ENABLED: ${{ vars.LIKE_ENABLED || 'false' }}
          HEADLESS: "true"
          # setup-chrome 输出的 chrome 可执行文件路径
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          NOTIFY_ENABLED: ${{ vars.NOTIFY_ENABLED || 'false' }}
          NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'telegram' }}
          NOTIFY_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFY_TELEGRAM_BOT_TOKEN }}
          NOTIFY_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFY_TELEGRAM_CHAT_ID }}
          LOG_LEVEL: INFO
          # 可选：住宅代理（治本），配置后优先于 WARP
          PLAYWRIGHT_PROXY: ${{ secrets.PLAYWRIGHT_PROXY }}
        run: uv run python -m src.main
